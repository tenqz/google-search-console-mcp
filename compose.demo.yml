services:
  mcp:
    image: ghcr.io/tenqz/google-search-console-mcp:${MCP_VERSION:-1.0.0}
    build: .
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:8080"]
    environment:
      MCP_DEMO: "true"
      MCP_AUTH_TOKEN: demo-token
      HTTP_ADDR: ":8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
