services:
  caddy:
    image: caddy:2.11.2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      MCP_HOST: ${MCP_HOST:?Set MCP_HOST to the public DNS hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      mcp:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
