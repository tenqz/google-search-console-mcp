name: Vulnerabilities
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '19 5 * * 1'
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
        env:
          GOFLAGS: -mod=readonly
