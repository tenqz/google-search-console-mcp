services:
  mcp:
    build:
      context: .
      target: runtime
    ports:
      - "${HTTP_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      HTTP_ADDR: ":8080"
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/service-account.json
    volumes:
      - ./credentials:/credentials:ro
    restart: unless-stopped

  tools:
    profiles: ["dev"]
    image: golang:1.25-bookworm
    working_dir: /src
    volumes:
      - .:/src
    command: sleep infinity
